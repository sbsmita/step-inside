<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 910" font-family="Helvetica, Arial, sans-serif" font-size="14">
  <style>
    .box { fill: #ffffff; stroke: #334155; stroke-width: 1.5; rx: 10; }
    .cv { fill: #eef4ff; stroke: #1f5fd1; }
    .aws { fill: #fff7ec; stroke: #d97706; }
    .ai { fill: #f3eefe; stroke: #7c3aed; }
    .client { fill: #ecfdf5; stroke: #059669; }
    .t { font-weight: 700; fill: #0f172a; }
    .s { fill: #475569; font-size: 12.5px; }
    .arrow { stroke: #334155; stroke-width: 1.5; fill: none; marker-end: url(#a); }
    .group { fill: none; stroke: #94a3b8; stroke-dasharray: 6 5; rx: 14; }
    .gl { fill: #64748b; font-size: 12px; font-weight: 700; letter-spacing: .06em; }
  </style>
  <defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#334155"/></marker></defs>

  <text x="24" y="34" font-size="22" class="t">Step Inside: architecture</text>
  <text x="24" y="56" class="s">One photographed page in → OpenCV reads it, parallel agents plan, paint and voice it → you watch it line by line (~8 s, or fully filmed in minutes) · browser or Meta Quest</text>

  <!-- The world comes alive (upgrades while the story plays) -->
  <path d="M590 550 V566" class="arrow"/>
  <rect x="300" y="566" width="876" height="150" class="group"/>
  <text x="316" y="586" class="gl">THE WORLD COMES ALIVE · while the story plays, each moment is upgraded and swapped in</text>
  <rect x="316" y="598" width="270" height="108" class="box cv"/>
  <text x="330" y="620" class="t">Actor agent (OpenCV 5)</text>
  <text x="330" y="640" class="s">YOLOX + depth pop-outs; the story's</text>
  <text x="330" y="656" class="s">words choose who moves; judge: size,</text>
  <text x="330" y="672" class="s">solidity, edges, ground; GrabCut matte</text>
  <text x="330" y="690" class="s">→ the character falls, walks, jumps in VR</text>
  <rect x="598" y="598" width="262" height="108" class="box cv"/>
  <text x="612" y="620" class="t">World life (OpenCV 5)</text>
  <text x="612" y="640" class="s">a 360° world for every moment;</text>
  <text x="612" y="656" class="s">wind from the sky's brush strokes</text>
  <text x="612" y="672" class="s">(structure tensor); sun/moon, lamps,</text>
  <text x="612" y="690" class="s">haze → glows, flicker, mist, weather</text>
  <rect x="900" y="598" width="276" height="108" class="box ai"/>
  <text x="914" y="620" class="t">Bedrock · Luma Ray2 + Inpaint</text>
  <text x="914" y="640" class="s">every moment → a film clip (async, S3;</text>
  <text x="914" y="656" class="s">us-west-2); OpenCV critic: ORB fidelity,</text>
  <text x="914" y="672" class="s">Farneback flow, cuts, frozen, lettering;</text>
  <text x="914" y="690" class="s">Inpaint paints plates + each full world</text>

  <!-- Client -->
  <rect x="24" y="90" width="230" height="150" class="box client"/>
  <text x="40" y="116" class="t">Browser / Meta Quest 3</text>
  <text x="40" y="138" class="s">three.js + WebXR viewer</text>
  <text x="40" y="156" class="s">thumbstick, teleport, pinch</text>
  <text x="40" y="174" class="s">story theatre: word captions, A/B</text>
  <text x="40" y="192" class="s">live Capture Coach (camera frames)</text>
  <text x="40" y="210" class="s">desktop fallback: drag, WASD</text>

  <rect x="300" y="120" width="170" height="90" class="box aws"/>
  <text x="316" y="146" class="t">CloudFront</text>
  <text x="316" y="168" class="s">HTTPS + WAF firewall</text>
  <text x="316" y="186" class="s">secret origin header</text>
  <path d="M254 165 H300" class="arrow"/>

  <rect x="510" y="120" width="160" height="90" class="box aws"/>
  <text x="526" y="146" class="t">Load balancer</text>
  <text x="526" y="168" class="s">→ Fargate API</text>
  <text x="526" y="186" class="s">password: Secrets Mgr</text>
  <path d="M470 165 H510" class="arrow"/>

  <!-- API container -->
  <rect x="300" y="250" width="560" height="300" class="group"/>
  <text x="316" y="272" class="gl">ECS FARGATE · GRAVITON (ARM64) · FastAPI CONTAINER</text>
  <path d="M590 210 V250" class="arrow"/>

  <rect x="316" y="284" width="260" height="122" class="box cv"/>
  <text x="330" y="306" class="t">Read the page (OpenCV 5)</text>
  <text x="330" y="326" class="s">page quad → warpPerspective (flatten)</text>
  <text x="330" y="344" class="s">PP-OCRv3 DB text detection (cv.dnn)</text>
  <text x="330" y="362" class="s">CRNN recognition, 8 copies in parallel</text>
  <text x="330" y="380" class="s">light-on-dark lines inverted (Otsu)</text>
  <text x="330" y="396" class="s">checks the story agent (see below)</text>

  <rect x="588" y="284" width="258" height="122" class="box cv"/>
  <text x="602" y="306" class="t">Every painting (OpenCV 5)</text>
  <text x="602" y="326" class="s">lettering found (DB detector) → repaint</text>
  <text x="602" y="344" class="s">Depth Anything V2 (cv.dnn) → relief</text>
  <text x="602" y="362" class="s">figures in the world: YOLOX → shift-map</text>
  <text x="602" y="380" class="s">wide painting → seamless 360° world</text>
  <text x="602" y="396" class="s">photo mode: layers, GrabCut → GLB</text>

  <rect x="316" y="418" width="530" height="118" class="box cv"/>
  <text x="330" y="440" class="t">Parallel agents, streamed: the first line plays in ~7–9 s</text>
  <text x="330" y="460" class="s">story agent streams moments → each is painted the moment it arrives (~3–4 s each)</text>
  <text x="330" y="478" class="s">world painted from the header · every line voiced · quota bucket (9/min) + overflow</text>
  <text x="330" y="496" class="s">OpenCV aligns OCR with the story: skipped lines restored, repeats dropped, lines boxed</text>
  <text x="330" y="514" class="s">browser polls every 0.4 s and starts when the world + first moment are ready</text>

  <!-- AI services -->
  <rect x="900" y="270" width="276" height="96" class="box ai"/>
  <text x="916" y="294" class="t">Amazon Bedrock · Nova Lite</text>
  <text x="916" y="314" class="s">reads the page image, streams the plan:</text>
  <text x="916" y="332" class="s">title, cast, spoken lines, moments</text>
  <text x="916" y="350" class="s">if filtered: picks OCR lines by number</text>

  <rect x="900" y="380" width="276" height="76" class="box ai"/>
  <text x="916" y="404" class="t">Bedrock · Stable Image Core</text>
  <text x="916" y="424" class="s">paints every moment + the world at once</text>
  <text x="916" y="442" class="s">(SD3.5 Large takes the quota overflow)</text>

  <rect x="900" y="470" width="276" height="66" class="box aws"/>
  <text x="916" y="494" class="t">Amazon Polly (neural)</text>
  <text x="916" y="514" class="s">every line + word timings, per voice</text>

  <path d="M846 330 H900" class="arrow"/>
  <path d="M846 450 C 875 450, 875 418, 900 418" class="arrow"/>
  <path d="M846 520 C 875 520, 875 503, 900 503" class="arrow"/>

  <!-- 3D reconstruction -->
  <rect x="24" y="300" width="250" height="236" class="box cv"/>
  <text x="40" y="324" class="t">Video → real 3D (OpenCV 5)</text>
  <text x="40" y="346" class="s">keyframes: Laplacian sharpness,</text>
  <text x="40" y="362" class="s">LK optical-flow parallax</text>
  <text x="40" y="382" class="s">SIFT + ratio test, findEssentialMat</text>
  <text x="40" y="398" class="s">(USAC_MAGSAC), feature tracks</text>
  <text x="40" y="418" class="s">recoverPose → triangulatePoints →</text>
  <text x="40" y="434" class="s">solvePnPRansac + solvePnPRefineLM</text>
  <text x="40" y="454" class="s">bundle adjustment (sparse LSQ)</text>
  <text x="40" y="474" class="s">dense: DNN depth scaled to SfM points,</text>
  <text x="40" y="490" class="s">cross-view consistency, floor RANSAC</text>
  <text x="40" y="512" class="s">Coach + Verifier agents decide next step</text>

  <rect x="24" y="730" width="250" height="80" class="box aws"/>
  <text x="40" y="754" class="t">Step Functions</text>
  <text x="40" y="774" class="s">reconstruct → narrate, retries/catch</text>
  <text x="40" y="792" class="s">Fargate Graviton worker task</text>
  <path d="M149 730 V536" class="arrow"/>
  <path d="M300 520 C 285 600, 280 720, 274 770" class="arrow"/>

  <!-- storage -->
  <rect x="316" y="750" width="250" height="76" class="box aws"/>
  <text x="332" y="774" class="t">Amazon S3</text>
  <text x="332" y="794" class="s">pages, worlds, cut-outs, clips, audio</text>
  <text x="332" y="810" class="s">(capture frames expire after 7 days)</text>

  <rect x="596" y="750" width="250" height="76" class="box aws"/>
  <text x="612" y="774" class="t">DynamoDB</text>
  <text x="612" y="794" class="s">scene index</text>

  <rect x="900" y="750" width="276" height="76" class="box aws"/>
  <text x="916" y="774" class="t">CloudWatch + X-Ray</text>
  <text x="916" y="794" class="s">container logs, pipeline execution logs,</text>
  <text x="916" y="810" class="s">Step Functions tracing; spending caps</text>

  <path d="M441 716 V750" class="arrow"/>
  <path d="M720 716 V750" class="arrow"/>

  <text x="24" y="870" class="s">Blue = OpenCV 5 work · Purple = generative models on Bedrock · Orange = AWS infrastructure (all defined in infra/ with AWS CDK) · Green = client</text>
  <text x="24" y="890" class="s">Without Bedrock, every step still runs: OpenCV's reading of the page, the page itself on the 3D screen, and browser speech.</text>
</svg>
